name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    env:
      # prisma generate / next build do not connect; a placeholder is enough
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  integration:
    name: Integration tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
      BASE_URL: http://localhost:3000
      # Lets the per-IP rate limit tests give each test its own client IP
      TRUST_PROXY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:deploy
      - run: npm run build
      - name: Start app
        run: |
          npm start > app.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http-get://localhost:3000/login
      - run: npm run test:integration
      - name: App log
        if: failure()
        run: cat app.log
